name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      SETTLE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      SETTLE_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Toxiproxy
        run: |
          mkdir -p bin
          curl -sSL -o bin/toxiproxy-server https://github.com/Shopify/toxiproxy/releases/download/v2.9.0/toxiproxy-server-linux-amd64
          chmod +x bin/toxiproxy-server
      - name: Types (mypy --strict)
        run: mypy
      - name: Tests
        run: pytest
      - name: Simulator, 1,000 seeds
        run: python -m sim.run seeds --count 1000
      - name: Planted bugs are caught
        run: python -m sim.run bugs --count 30
      - name: Compose file is valid
        run: docker compose config -q
      - name: Prometheus config and alert rules (promtool)
        run: |
          docker run --rm -v "$PWD/deploy:/d" --entrypoint promtool prom/prometheus:v2.53.2 check config /d/prometheus.yml
          docker run --rm -v "$PWD/deploy:/d" --entrypoint promtool prom/prometheus:v2.53.2 test rules /d/alerts_test.yml
