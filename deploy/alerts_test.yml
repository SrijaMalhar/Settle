# promtool test rules deploy/alerts_test.yml
rule_files: [alerts.yml]
evaluation_interval: 5s

tests:
  - name: a shard dies and the standby takes over within the grace period
    interval: 5s
    input_series:
      - series: settle_owned_logical_shards{instance="shard-1"}
        values: 4x40
      - series: settle_owned_logical_shards{instance="shard-2"}
        values: 4x4 0x36
      - series: settle_owned_logical_shards{instance="standby"}
        values: 0x5 4x35
      - series: settle_owned_logical_shards{instance="shard-3"}
        values: 4x40
    alert_rule_test:
      - eval_time: 1m
        alertname: LogicalShardWithoutOwner
        exp_alerts: []

  - name: a shard dies and nobody takes over
    interval: 5s
    input_series:
      - series: settle_owned_logical_shards{instance="shard-1"}
        values: 4x40
      - series: settle_owned_logical_shards{instance="shard-2"}
        values: 4x4 0x36
      - series: settle_owned_logical_shards{instance="shard-3"}
        values: 4x40
    alert_rule_test:
      - eval_time: 1m
        alertname: LogicalShardWithoutOwner
        exp_alerts:
          - exp_labels: {severity: page}
            exp_annotations:
              summary: "8 of 12 logical shards have an owner: the rest cannot take payments"
              action: "Is the standby running? A takeover normally finishes in under a second."

  - name: a breaker that stays open, on any shard
    interval: 30s
    input_series:
      - series: settle_breaker_state{psp="icici", instance="shard-1"}
        values: 0 2 2 2 2 2 2
      - series: settle_breaker_state{psp="icici", instance="shard-2"}
        values: 0 0 0 0 0 0 0
      - series: settle_breaker_state{psp="axis", instance="shard-1"}
        values: 0 2 0 0 0 0 0
    alert_rule_test:
      - eval_time: 3m
        alertname: PspBreakerOpen
        exp_alerts:
          - exp_labels: {severity: ticket, psp: icici}
            exp_annotations:
              summary: "The breaker for icici has been open for 2 minutes"
              action: "Traffic has moved to the other PSPs. Check the PSP's status page."
