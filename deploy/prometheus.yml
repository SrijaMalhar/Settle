# Scrapes every shard process (including the standby) and every gateway replica. Docker's DNS
# returns one address per container, so replicas and restarted containers are found by name.
global:
  scrape_interval: 2s
  evaluation_interval: 5s

rule_files: [alerts.yml]   # relative to this file

scrape_configs:
  - job_name: shards
    dns_sd_configs:
      - names: [shard-1, shard-2, shard-3, standby]
        type: A
        port: 9000
        refresh_interval: 5s

  - job_name: gateways
    dns_sd_configs:
      - names: [gateway]
        type: A
        port: 8000
        refresh_interval: 5s
